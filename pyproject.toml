[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-spidra"
version = "0.1.0"
description = "An integration package connecting Spidra and LangChain"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["langchain", "spidra", "web-scraping", "rag", "document-loader"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "spidra>=0.3.0",
    "langchain-core>=0.3.0,<2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
lint = [
    "ruff>=0.5.0",
]
typing = [
    "mypy>=1.10.0",
    "langchain-core>=0.3.0,<2.0.0",
]
dev = [
    "langchain-spidra[test,lint,typing]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit_tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
disallow_untyped_defs = true

[tool.hatch.build.targets.wheel]
packages = ["langchain_spidra"]

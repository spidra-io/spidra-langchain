[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-spidra"
version = "0.1.0"
description = "LangChain document loader for Spidra web scraping API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["langchain", "spidra", "web-scraping", "rag", "document-loader"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "spidra>=0.3.0",
    "langchain-core>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "langchain-core>=0.1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_spidra"]
